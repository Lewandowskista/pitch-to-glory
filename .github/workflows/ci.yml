name: Validate and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# The public address (repository variable SITE_URL; empty means the default Pages address).
# The build writes it into share tags and the release journey checks the build against it.
env:
  SITE_URL: ${{ vars.SITE_URL }}
jobs:
  # The deployable build first, on its own, so the browser journeys can start on it while the
  # unit tests run. The build script runs the strict typecheck and the per-route bundle budget.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      # One national season of headless career play: invariants, export, import and the size
      # limit at its end (scripts/soak-career.ts). Longer runs are in endurance.yml.
      - run: npm run soak -- --seasons 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: soak-smoke
          path: artifacts/soak/*.json
          if-no-files-found: ignore
  # Every unit test, split across three machines.
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx vitest run --shard=${{ matrix.shard }}/3
  # Browser journeys run on Windows, two machines per engine, against the build. Linux WebKit
  # runners have no GPU, and its WebGL crashes the browser during the match renderer.
  browsers:
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: dist
      - run: npx playwright install ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2
      # A second release replaces the first under a saved career (e2e/update.spec.ts).
      - if: matrix.browser == 'chromium' && matrix.shard == 1
        run: npm run test:update
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results-${{ matrix.browser }}-${{ matrix.shard }}
          path: test-results
  # The release journey for a separately built custom domain (dist-custom, never the deployed
  # dist), so the documented SITE_URL override keeps passing the gate.
  custom-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:release:custom
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: custom-domain-results
          path: test-results
  deploy:
    needs: [build, checks, unit, browsers, custom-domain]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL || 'https://pitch-to-glory.pages.dev' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: pitch-to-glory
      WRANGLER: wrangler@4.148.0
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: dist
      - name: Skip deployment until Cloudflare is configured
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to deploy."
      # Cloudflare Pages free tier: direct upload of the verified build (no Cloudflare build).
      - name: Create the Pages project on first deploy
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          if npx --yes "$WRANGLER" pages project list | grep -q " $PROJECT "; then
            echo "Pages project $PROJECT exists."
          else
            npx --yes "$WRANGLER" pages project create "$PROJECT" --production-branch=main
          fi
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          # Passed through the environment, never interpolated into the script.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          npx --yes "$WRANGLER" pages deploy dist --project-name="$PROJECT" --branch=main --commit-hash="$GITHUB_SHA" --commit-message="$(printf '%s' "$COMMIT_MESSAGE" | head -n 1)"
