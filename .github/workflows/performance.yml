name: Performance
# Performance on real play states (docs/VERIFICATION.md, Phase 4.2): deterministic career
# saves, timed journeys with frame pacing and interaction latency, and Lighthouse on loaded
# career pages. Serialized and off the critical path; the fast route budgets run in ci.yml.
on:
  schedule:
    # Weekly (Saturday).
    - cron: '29 4 * * 6'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: performance
  cancel-in-progress: false
jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run perf:fixtures
      # One job at a time: the journeys, then Lighthouse, never alongside each other.
      - run: npm run test:performance
      - run: npm run lighthouse -- --populated
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-results
          path: |
            artifacts/performance/results.json
            artifacts/lighthouse-*.json
          if-no-files-found: warn
  balance:
    # The balance gates (docs/GAME-DESIGN-REVIEW.md, pass E): a career to retirement per
    # position, the match profile and a twelve-season world, each checked against its gates.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run profile -- --seed review-a --position ST
      - run: npm run profile -- --seed review-b --position CM
      - run: npm run profile -- --seed review-c --position CB
      # For the 1.0 targets (step 2.3): a keeper for honours fairness, and a sponsor-accepting
      # career for the economy (C19; judged by the targets only, not the gates).
      - run: npm run profile -- --seed review-d --position GK
      - run: npm run profile -- --seed review-a --position ST --policy sponsor
      - run: npm run profile -- --check
      # Two seeds: the 1.0 "choices matter" target is judged on both (step 2.3).
      - run: npm run profile:match -- --matches 300 --seeds match-profile,match-profile-b
        if: always()
      - run: npm run profile:match -- --check
        if: always()
      - run: npm run profile:world -- --seasons 12 --seed review-world
        if: always()
      - run: npm run profile:world -- --check
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: balance-profiles
          path: artifacts/profile/*.json
          if-no-files-found: warn
